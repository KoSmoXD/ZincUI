name: ZincUI checks
on:
  push:
  pull_request:

jobs:
  lua-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax check
        run: |
          luac5.4 -p ZincUI.lua
          luac5.4 -p examples/Example.client.lua
          luac5.4 -p tests/api_smoke.lua
      - name: Mocked API smoke tests
        run: lua5.4 tests/api_smoke.lua
